<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve on iOS,
         which the floating bottom nav depends on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Amanuel Berhanu — Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Amanuel Berhanu, a 3rd-year computer science student who builds software products end to end."
    />
    <meta name="author" content="Amanuel Berhanu" />
    <meta name="robots" content="index, follow" />
    <!-- Both schemes are real now, so the UA may style form controls and the
         canvas for either. The two `theme-color` entries let the mobile browser
         chrome follow the active theme instead of always painting near-black. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!--
      Applies the stored (or system) theme before the first paint. This is the
      one piece of JavaScript that has to be inline and synchronous: a module
      script is deferred, so the page would paint in the light default and then
      snap to dark. It only sets a class — the palette itself is CSS.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement.classList;
          root.add(dark ? 'dark' : 'light');
          root.remove(dark ? 'light' : 'dark');
        } catch (error) {
          /* Storage or matchMedia unavailable — the CSS media-query fallback
             in index.css still gives a system-dark visitor the dark theme. */
        }
      })();
    </script>

    <!-- The type stack declared in index.css ("Inter" + "JetBrains Mono") is now
         actually fetched; previously it silently fell back to system fonts.
         Weights are the ones the CSS actually uses: Inter 300 (font-light),
         400 and 500 (font-medium); JetBrains Mono 400 and 500. Requesting 600
         would ship a font file nothing renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amanuel Berhanu — Portfolio" />
    <meta property="og:title" content="Amanuel Berhanu — Portfolio" />
    <meta
      property="og:description"
      content="I build software-related products, from data models to interfaces. Case studies with honest write-ups of decisions and trade-offs."
    />
    <!-- `summary`, not `summary_large_image`: there is no 1200x630 card asset. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Amanuel Berhanu — Portfolio" />
    <meta
      name="twitter:description"
      content="I build software-related products, from data models to interfaces."
    />
    <!-- Structured data: who this portfolio belongs to, in the one place a
         crawler reads without running the app. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Amanuel Berhanu",
        "description": "3rd-year computer science student building software products end to end.",
        "sameAs": ["https://github.com/amani-b"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      This is a client-rendered single-page app: with JavaScript off, `#root`
      stays empty and the page would be blank with no explanation. The styles
      are inlined here rather than classed because the built stylesheet is
      injected by the bundle, which by definition has not run.
    -->
    <noscript>
      <p
        style="
          margin: 0;
          padding: 2.5rem 1.5rem;
          background: #fafafa;
          color: #0a0a0a;
          font-family: system-ui, -apple-system, sans-serif;
          line-height: 1.6;
        "
      >
        This page is rendered in the browser and needs JavaScript enabled. The
        work it describes is also on
        <a href="https://github.com/amani-b" style="color: #2563eb">github.com/amani-b</a>.
      </p>
    </noscript>
    <noscript>
      <!--
        With no JavaScript there is no stored preference and no class on <html>,
        so the palette follows the system — these values mirror the
        `prefers-color-scheme` block in index.css. Inlined rather than classed
        because the built stylesheet is injected by the bundle, which by
        definition has not run.
      -->
      <style>
        @media (prefers-color-scheme: dark) {
          body {
            background: #0a0a0a;
          }
          p {
            background: #0a0a0a !important;
            color: #ededed !important;
          }
          p a {
            color: #3b82f6 !important;
          }
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
